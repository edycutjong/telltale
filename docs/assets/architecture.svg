<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="Overpass, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Telltale architecture on QNX 8.0</title>
  <desc id="d">vehfeed writes the vehicle state to the vehicled resource manager. The cluster renderer and the Telltale monitor both read it by message passing. The renderer posts a window to QNX Screen. The monitor reads the composed display back from Screen, compares it with the vehicle state, and on a mismatch posts a safe-layer window, kills the renderer and the renderer is respawned (slm, or a shell loop in the bench). vehfeed, vehicled, cluster and telltale each run in their own secpol type.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57534B"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F7A4D"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C8321E"/></marker>
  </defs>
  <rect width="960" height="500" fill="#EFE9DC"/>
  <rect x="16" y="16" width="928" height="468" rx="6" fill="none" stroke="#B9B1A0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="32" y="40" font-size="13" font-weight="700" fill="#57534B" letter-spacing="1">QNX 8.0 GUEST · QEMU (x86_64, TCG) · vehfeed · vehicled · cluster · telltale each run in their own secpol type</text>

  <!-- vehfeed -->
  <rect x="40" y="90" width="150" height="64" rx="4" fill="#F7F3EA" stroke="#1C1B19"/>
  <text x="115" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1C1B19">vehfeed</text>
  <text x="115" y="136" text-anchor="middle" font-size="12" fill="#57534B">real comma2k19 speed</text>

  <!-- vehicled -->
  <rect x="290" y="90" width="190" height="64" rx="4" fill="#F7F3EA" stroke="#1C1B19"/>
  <text x="385" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1C1B19">vehicled</text>
  <text x="385" y="136" text-anchor="middle" font-size="12" fill="#57534B">resource manager /dev/vehicle</text>

  <!-- cluster -->
  <rect x="40" y="260" width="190" height="72" rx="4" fill="#F7F3EA" stroke="#1C1B19"/>
  <text x="135" y="287" text-anchor="middle" font-size="15" font-weight="700" fill="#1C1B19">cluster</text>
  <text x="135" y="307" text-anchor="middle" font-size="12" fill="#57534B">renderer · the thing that can lie</text>
  <text x="135" y="322" text-anchor="middle" font-size="11" fill="#57534B">prio 20 · renderer_t</text>

  <!-- screen -->
  <rect x="330" y="360" width="230" height="72" rx="4" fill="#0E0D0B" stroke="#0E0D0B"/>
  <text x="445" y="388" text-anchor="middle" font-size="15" font-weight="700" fill="#F4F1E8">QNX Screen</text>
  <text x="445" y="408" text-anchor="middle" font-size="12" fill="#F4F1E8">composes the display the driver sees</text>

  <!-- telltale -->
  <rect x="640" y="230" width="270" height="110" rx="4" fill="#F7F3EA" stroke="#1F7A4D" stroke-width="3"/>
  <text x="775" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#1F7A4D">telltale</text>
  <text x="775" y="278" text-anchor="middle" font-size="12" fill="#1C1B19">isolated monitor · SCHED_FIFO 60 · monitor_t</text>
  <text x="775" y="298" text-anchor="middle" font-size="12" fill="#57534B">read back → decode digits + lamps</text>
  <text x="775" y="314" text-anchor="middle" font-size="12" fill="#57534B">→ compare with truth → safe layer,</text>
  <text x="775" y="330" text-anchor="middle" font-size="12" fill="#57534B">kill, verify, hand back</text>

  <!-- slm -->
  <rect x="640" y="90" width="150" height="64" rx="4" fill="#F7F3EA" stroke="#1C1B19"/>
  <text x="715" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1C1B19">slm / shell loop</text>
  <text x="715" y="136" text-anchor="middle" font-size="12" fill="#57534B">respawns on abnormal exit</text>

  <!-- outputs -->
  <rect x="780" y="400" width="130" height="52" rx="4" fill="#F7F3EA" stroke="#1C1B19"/>
  <text x="845" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#1C1B19">slog2 + events</text>
  <text x="845" y="440" text-anchor="middle" font-size="11" fill="#57534B">/dev/telltale-events</text>

  <!-- edges -->
  <path d="M190 122H288" stroke="#57534B" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="239" y="114" text-anchor="middle" font-size="11" fill="#57534B">devctl SET</text>
  <path d="M340 156L190 258" stroke="#57534B" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="222" y="196" text-anchor="middle" font-size="11" fill="#57534B">ionotify pulse + devctl GET</text>
  <path d="M430 156L700 228" stroke="#57534B" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="760" y="214" text-anchor="middle" font-size="11" fill="#57534B">devctl GET_SINCE, polled each check</text>
  <path d="M135 334L135 396L328 396" stroke="#C8321E" stroke-width="2.2" fill="none" marker-end="url(#r)"/>
  <text x="146" y="368" font-size="11" fill="#C8321E" font-weight="700">screen_post_window</text><text x="146" y="382" font-size="11" fill="#C8321E">(the window may lie)</text>
  <path d="M562 400L700 342" stroke="#1F7A4D" stroke-width="2.2" fill="none" marker-end="url(#g)"/>
  <text x="600" y="425" text-anchor="middle" font-size="11" fill="#1F7A4D" font-weight="700">screen_read_display</text>
  <path d="M668 342L560 372" stroke="#1F7A4D" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#g)"/>
  <text x="470" y="346" font-size="11" fill="#1F7A4D">safe-layer window, z-top</text>
  <path d="M640 285L232 292" stroke="#C8321E" stroke-width="1.8" fill="none" marker-end="url(#r)"/>
  <text x="436" y="274" text-anchor="middle" font-size="11" fill="#C8321E">SIGKILL (hung / wrong / blank)</text>
  <path d="M680 156L226 262" stroke="#57534B" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#a)"/>
  <text x="400" y="246" font-size="11" fill="#57534B" transform="rotate(-13 400 246)">respawn</text>
  <path d="M845 342V398" stroke="#57534B" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="32" y="470" font-size="12" fill="#57534B">Red = the path that can lie. Green = the path that checks it. Timings are QEMU (TCG), not hardware.</text>
</svg>
