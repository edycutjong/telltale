<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Telltale — a strip of tachograph chart: the black true-speed trace falls to 0, the red displayed trace stays flat at 48, a green tick ends the lie">
  <title>Telltale</title>
  <defs>
    <linearGradient id="tt-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--bg-elevated-solid, #F7F3EA)"/>
      <stop offset="100%" stop-color="var(--bg, #EFE9DC)"/>
    </linearGradient>
  </defs>
  <!-- chart plate: wax-paper sheet with an ink rim (self-plated: holds on GitHub light and dark) -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#tt-paper)" stroke="var(--ink, #1C1B19)" stroke-width="22"/>
  <!-- chart hairlines (speed grid) -->
  <path d="M70 176 H442 M70 400 H442" stroke="var(--rule, #B9B1A0)" stroke-width="4" fill="none"/>
  <!-- the lie: displayed speed frozen at 48 -->
  <path d="M200 176 H420" stroke="var(--primary, #C8321E)" stroke-width="52" stroke-linecap="round" fill="none"/>
  <!-- the truth: real speed falls to 0 (shape of the hero stop) -->
  <path d="M92 176 H200 C244 176 272 290 302 352 C318 386 338 400 364 400 H420" stroke="var(--ink, #1C1B19)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- the catch: green tick where the red rejoins the black -->
  <path d="M254 112 V300" stroke="var(--accent, #1F7A4D)" stroke-width="36" stroke-linecap="round" fill="none"/>
</svg>
