name: CI/CD Pipeline

# 6 stages, adapted to a C (QNX target) + Python (host tools) repo:
#   1 Quality  ─┐                       ┌─> 4 E2E replay ─┐
#               ├─ parallel ─> 3 Build ─┤                 ├─> 6 Release (main only: semver tag + GitHub Release)
#   2 Security ─┘                       └─> 5 Repro gate ─┘
# Stage 6 is the only place a release is cut, and it needs every other stage: a red or cancelled run tags nothing.
# The QNX cross-build (qcc) cannot run here: the QNX SDP is only downloadable behind a myQNX login and licence
# (see CONTRIBUTING.md). The target is exercised by `make test-target` on a QEMU guest; its raw logs are committed
# under evidence/test-target/. Stage 4 re-asserts the run README.md cites on every push: the claim matches its summary,
# the code under test is unchanged since the recorded commit, every case and core/secpol line is re-checked.
# CodeQL runs in codeql.yml (Python + the host-buildable C; the QNX-only sources need the SDP).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # every main commit gets a full verdict

permissions:
  contents: read

jobs:
  # ── STAGE 1: Code quality (parallel with Stage 2) ─────────
  quality:
    name: "Stage 1 · Quality (ruff + Python tests)"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # full matrix on main, one interpreter on PRs
        python-version: ${{ github.event_name == 'push' && fromJSON('["3.11", "3.12", "3.13"]') || fromJSON('["3.12"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: make lint
      - name: Python host tests
        run: make test-host-py

  # ── STAGE 2: Security gate (parallel with Stage 1) ────────
  security:
    name: "Stage 2 · Security (gitleaks + repo hygiene)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the public flip is judged on the past, not just the tip
      - name: gitleaks (full history)
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          # sha256 from the release's gitleaks_8.21.2_checksums.txt: a swapped download fails here instead of running
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks_8.21.2_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
          ./gitleaks detect --source . --log-opts="--all" --redact --verbose
      - name: Kitchen never enters the public repo
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.claude|AGENTS\.md|CLAUDE\.md|specs|submission)(/|$)' || true)
          if [ -n "$bad" ]; then echo "::error::kitchen files tracked:"; echo "$bad"; exit 1; fi
      - name: License is Apache-2.0
        run: grep -q "Apache License" LICENSE && grep -q "Version 2.0" LICENSE
      - name: Dependencies
        run: |
          # The C code has no third-party dependencies. The host Python pins are all in requirements-dev.txt: ruff (lint),
          # Pillow (check_run.py reads captured frames) and numpy (tools/ttv_decode.py); Dependabot proposes updates.
          pip install pip-audit && pip-audit -r requirements-dev.txt

  # ── STAGE 3: Build verification ───────────────────────────
  build:
    name: "Stage 3 · Build (host C, ${{ matrix.cc }}, -Werror)"
    needs: [quality, security]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Build and run the host C checks
        run: make test-host-c CC=${{ matrix.cc }}

  # ── STAGE 4: End-to-end replay of the real target run ─────
  e2e:
    name: "Stage 4 · E2E (re-assert the recorded QNX/QEMU run)"
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the replay diffs the code under test against the commit the run was recorded at
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: README's on-target claim = the cited run, code unchanged since, every assertion re-checked
        run: scripts/replay_target_run.sh

  # ── STAGE 5: Reproducibility / performance gate ───────────
  perf:
    name: "Stage 5 · Reproducible bench tables"
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerate evidence/RESULTS.md and evidence/report.html from the committed raw rows
        run: scripts/bench_all.sh report
      - name: Fail if the regenerated tables or plots differ from the committed ones
        run: |
          git diff --exit-code -- evidence/RESULTS.md evidence/report.html \
            || { echo "::error::evidence/RESULTS.md or report.html is not reproducible from evidence/*.csv"; exit 1; }

  # ── STAGE 6: Release (main only, after every gate) ──────
  release:
    name: "Stage 6 · Release (semver tag + GitHub Release)"
    needs: [quality, security, build, e2e, perf]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write        # this job only: push the tag and create the Release
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history: commits since the last tag decide the bump

      - name: Compute next version from conventional commits
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if [ -n "$(git tag --contains HEAD)" ]; then   # a newer run already released a descendant of this commit
            echo "HEAD is already in $(git tag --contains HEAD | head -1)"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            RANGE=""; CUR="0.0.0"
          else
            RANGE="${LAST}..HEAD"; CUR="${LAST#v}"
          fi
          # the type comes from commit SUBJECTS only (a body line starting "fix:" must not cut a release);
          # a breaking change is a "type!:" subject or a "BREAKING CHANGE:" footer line in a body
          SUBJ=$(git log --format=%s ${RANGE:+"$RANGE"})
          BODY=$(git log --format=%b ${RANGE:+"$RANGE"})
          if [ -z "$(echo "$SUBJ" | tr -d '[:space:]')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          BUMP="none"
          { echo "$SUBJ" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$BODY" | grep -qE '^BREAKING CHANGE:'; } && BUMP="major"
          [ "$BUMP" = none ] && echo "$SUBJ" | grep -qE '^feat(\(.+\))?:'        && BUMP="minor"
          [ "$BUMP" = none ] && echo "$SUBJ" | grep -qE '^(fix|perf)(\(.+\))?:'  && BUMP="patch"
          if [ "$BUMP" = none ]; then
            echo "No releasable commits since ${LAST:-the beginning}."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          IFS=. read -r MA MI PA <<< "$CUR"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          NEXT="v${MA}.${MI}.${PA}"
          echo "Bump: $BUMP  ${LAST:-none} -> $NEXT"
          echo "next=$NEXT"  >> "$GITHUB_OUTPUT"
          echo "skip=false"  >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.next }}" -m "${{ steps.ver.outputs.next }}"
          git push origin "${{ steps.ver.outputs.next }}"
          gh release create "${{ steps.ver.outputs.next }}" \
            --generate-notes --title "${{ steps.ver.outputs.next }}"
