# Telltale monitor configuration -- PROVISIONAL (P1b). The P1c calibration run replaces these with measured values.
# tick_stall_ms: the renderer draws ~30 fps on QEMU (TCG) (mean tick gap 33 ms, max 62 ms in the first clean run),
# so 2 x period + 1 frame = 73 ms; 100 ms keeps a margin until calibration.
period_ms=20
W_ms=100
tick_stall_ms=100
truth_lost_ms=200
restart_timeout_ms=4000
mismatch_n=3
truth_ok_n=5
