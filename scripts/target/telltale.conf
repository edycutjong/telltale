# Telltale monitor configuration -- CALIBRATED in P1c from a clean run, frozen BEFORE any fault run (the git SHA in every
# bench row proves the order; never tuned after seeing fault results).
#
# Calibration run: evidence/calibration/cal1-none (QEMU TCG, 600 s of the real comma2k19 bench trace, host load1 25-70,
#   monitor disarmed from acting via tick_stall_ms=1000 for that run only): 31,481 live checks, 19,701 renderer frames,
#   gap p50 38.5 / p95 41.5 / p99 42.5 / max 100.2 ms, 0 non-PASS verdicts. Rule (complexity.md section 2):
#   tick_stall_ms = ceil(max frame gap x 1.5) = ceil(100.2 x 1.5) = 151 (scripts/calibrate.py reproduces it).
# W_ms = 100 is kept (pre-registered; 0 false mismatches in 31,481 clean checks at W=100, so no widening was needed).
# restart_timeout_ms = 4000: from the P1b on-target runs, safe layer <= 38 ms and respawn well inside 4 s; kept, not tuned.
# `ttctl period` re-derives from these configured values, never below the floor (2 x period + one renderer frame).
period_ms=20
W_ms=100
tick_stall_ms=151
truth_lost_ms=200
restart_timeout_ms=4000
mismatch_n=3
truth_ok_n=5
