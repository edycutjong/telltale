# Telltale monitor configuration -- PROVISIONAL (P1b). The P1c calibration run replaces these with measured values.
# tick_stall_ms: the monitor never goes below its derived floor (2 x period + one renderer frame). On QEMU (TCG) a first
# suite run at 100 ms (not kept in the repo) gave false TICK_STALLs on clean drives, so 150 ms until the P1c calibration
# measures the renderer's tick gaps. `ttctl period` re-derives from these configured values, never below them.
period_ms=20
W_ms=100
tick_stall_ms=150
truth_lost_ms=200
restart_timeout_ms=4000
mismatch_n=3
truth_ok_n=5
